[package]
name = "panda-ai-desktop-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
diesel = { version = "2", features = ["sqlite", "r2d2", "chrono"] }
diesel_migrations = "2"
r2d2 = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.7"
anyhow = "1"
log = "0.4"
tokio-stream = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
lancedb = { version = "0.16", optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
tokenizers = { version = "0.21", optional = true }
futures = "0.3"
tauri-plugin-dialog = "2"
urlencoding = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["p4-graph"]
p2-knowledge = ["lancedb", "tokenizers", "arrow-array", "arrow-schema"]
p3-agent = ["p2-knowledge"]
p4-graph = ["p3-agent"]

[lib]
name = "panda_ai_desktop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
